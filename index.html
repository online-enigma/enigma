<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secret Message Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top left, #0a0a0f, #111122 60%);
      color: #eee;
      padding: 30px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start; /* top align instead of center */
      overflow-x: hidden; /* allow vertical scroll but prevent sideways scroll */
      position: relative;
    }

    /* Floating cubes background */
    .cube {
      position: fixed;
      width: 20px;
      height: 20px;
      background: rgba(0, 153, 255, 0.25);
      border: 1px solid rgba(0, 180, 255, 0.5);
      box-shadow: 0 0 12px rgba(0, 150, 255, 0.6);
      animation: floatCube 12s linear infinite;
      transform: rotate(45deg);
      z-index: 0;
    }

    @keyframes floatCube {
      0% {
        transform: translateY(100vh) rotate(45deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-20vh) rotate(225deg);
        opacity: 0;
      }
    }

    .container {
      background: rgba(20, 20, 30, 0.95);
      border: 1px solid #009dff55;
      border-radius: 15px;
      box-shadow: 0 0 25px #009dff33, inset 0 0 20px #009dff11;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      backdrop-filter: blur(6px);
      position: relative;
      z-index: 10; /* keep above cubes */
    }

    h1 {
      text-align: center;
      color: #00aaff;
      text-shadow: 0 0 15px #00aaffaa, 0 0 30px #0077ff66;
      margin-bottom: 20px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: #0e0e16;
      border: 1px solid #222;
      color: #fff;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      transition: all 0.2s ease;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #00aaff;
      box-shadow: 0 0 12px #00aaff66;
    }

    label {
      margin-top: 20px;
      display: block;
      font-weight: 600;
      color: #bbb;
      letter-spacing: 0.5px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: linear-gradient(135deg, #00aaff, #0066ff);
      border: none;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
      letter-spacing: 1px;
      font-size: 1rem;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 20px #00aaffaa, 0 0 40px #0066ff77;
    }

    textarea[readonly] {
      opacity: 0.9;
    }

    .note {
      font-size: 0.9em;
      color: #aaa;
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Background cubes -->
  <div class="cube" style="left:10%; animation-delay:0s;"></div>
  <div class="cube" style="left:30%; animation-delay:3s;"></div>
  <div class="cube" style="left:50%; animation-delay:6s;"></div>
  <div class="cube" style="left:70%; animation-delay:9s;"></div>
  <div class="cube" style="left:90%; animation-delay:1.5s;"></div>

  <div class="container">
    <h1>Secret Message Generator</h1>

    <label>Message:</label>
    <textarea id="message" rows="4" placeholder="Enter your message here..."></textarea>

    <label>Enter 3-step encryption code (max 9999 for each):</label>
    <input type="number" id="rotor1" value="0" min="0" max="9999">
    <input type="number" id="rotor2" value="0" min="0" max="9999">
    <input type="number" id="rotor3" value="0" min="0" max="9999">

    <button onclick="processMessage()">Encrypt / Decrypt</button>

    <label>Output:</label>
    <textarea id="output" rows="4" readonly></textarea>

    <p class="note">Spaces are automatically replaced with underscores.</p>
  </div>

  <script>
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ_";

    function shiftChar(char, offset) {
      const idx = alphabet.indexOf(char);
      if (idx === -1) return char;
      return alphabet[(idx + offset + alphabet.length) % alphabet.length];
    }

    function reflectChar(char) {
      const idx = alphabet.indexOf(char);
      if (idx === -1) return char;
      return alphabet[alphabet.length - 1 - idx];
    }

    function processMessage() {
      const input = document.getElementById("message").value;
      const r1Start = parseInt(document.getElementById("rotor1").value) % 27;
      const r2Start = parseInt(document.getElementById("rotor2").value) % 27;
      const r3Start = parseInt(document.getElementById("rotor3").value) % 27;

      let rotor1 = r1Start, rotor2 = r2Start, rotor3 = r3Start;
      let encrypted = "";

      for (let ch of input) {
        const upperCh = ch.toUpperCase();
        if (!alphabet.includes(upperCh)) {
          encrypted += ch;
        } else {
          let c = shiftChar(upperCh, rotor1);
          c = shiftChar(c, rotor2);
          c = shiftChar(c, rotor3);

          c = reflectChar(c);

          c = shiftChar(c, -rotor3);
          c = shiftChar(c, -rotor2);
          c = shiftChar(c, -rotor1);

          encrypted += c;

          rotor1 = (rotor1 + 1) % 27;
          if (rotor1 === 0) {
            rotor2 = (rotor2 + 1) % 27;
            if (rotor2 === 0) {
              rotor3 = (rotor3 + 1) % 27;
            }
          }
        }
      }

      document.getElementById("output").value = encrypted;
    }

    const messageBox = document.getElementById("message");

    // 🔹 Replace spacebar press with underscore
    messageBox.addEventListener("keydown", function(e) {
      if (e.key === " ") {
        e.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        this.value = this.value.substring(0, start) + "_" + this.value.substring(end);
        this.setSelectionRange(start + 1, start + 1);
      }
    });

    // 🔹 Replace pasted/typed spaces with underscores
    messageBox.addEventListener("input", function() {
      if (this.value.includes(" ")) {
        const cursor = this.selectionStart;
        this.value = this.value.replace(/ /g, "_");
        this.setSelectionRange(cursor, cursor);
      }
    });
  </script>
</body>
</html>
