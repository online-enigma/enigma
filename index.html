<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secret Message Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top left, #0a0a0f, #111122 60%);
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .cube {
      position: fixed;
      width: 20px;
      height: 20px;
      background: rgba(0, 153, 255, 0.25);
      border: 1px solid rgba(0, 180, 255, 0.5);
      box-shadow: 0 0 12px rgba(0, 150, 255, 0.6);
      animation: floatCube 12s linear infinite;
      transform: rotate(45deg);
      z-index: 0;
    }

    @keyframes floatCube {
      0% { transform: translateY(100vh) rotate(45deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-20vh) rotate(225deg); opacity: 0; }
    }

    .container {
      background: rgba(20, 20, 30, 0.95);
      border: 1px solid #009dff55;
      border-radius: 15px;
      box-shadow: 0 0 25px #009dff33, inset 0 0 20px #009dff11;
      padding: 25px;
      width: 400px;
      max-height: 90%;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(6px);
      z-index: 10;
      align-items: center;
    }

    h1 {
      text-align: center;
      color: #00aaff;
      text-shadow: 0 0 15px #00aaffaa, 0 0 30px #0077ff66;
      margin-bottom: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      font-size: 1.4rem;
    }

    label {
      margin-top: 15px;
      font-weight: 600;
      color: #bbb;
      font-size: 0.9rem;
      text-align: center;
    }

    input, textarea, button {
      display: block;
      margin: 10px auto 0 auto;
      width: 90%;
      max-width: 360px;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      text-align: center;
    }

    input, textarea {
      background: #0e0e16;
      border: 1px solid #222;
      color: #fff;
    }

    input:focus, textarea:focus {
      border-color: #00aaff;
      box-shadow: 0 0 12px #00aaff66;
    }

    button {
      margin-top: 18px;
      background: linear-gradient(135deg, #00aaff, #0066ff);
      border: none;
      font-weight: bold;
      cursor: pointer;
      color: #fff;
      letter-spacing: 1px;
      font-size: 1rem;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 20px #00aaffaa, 0 0 40px #0066ff77;
    }

    textarea[readonly] {
      opacity: 0.9;
    }

    .note {
      font-size: 0.8em;
      color: #aaa;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="cube" style="left:10%; animation-delay:0s;"></div>
  <div class="cube" style="left:30%; animation-delay:3s;"></div>
  <div class="cube" style="left:50%; animation-delay:6s;"></div>
  <div class="cube" style="left:70%; animation-delay:9s;"></div>
  <div class="cube" style="left:90%; animation-delay:1.5s;"></div>

  <div class="container">
    <h1>Secret Message Generator</h1>

    <label>Message:</label>
    <textarea id="message" rows="3" placeholder="Enter your message here..."></textarea>

    <label>Enter 3-step encryption code (max 9999 for each):</label>
    <input type="number" id="rotor1" value="0" min="0" max="9999">
    <input type="number" id="rotor2" value="0" min="0" max="9999">
    <input type="number" id="rotor3" value="0" min="0" max="9999">

    <button onclick="processMessage()">Encrypt / Decrypt</button>

    <label>Output:</label>
    <textarea id="output" rows="3" readonly></textarea>

    <p class="note">Spaces are automatically replaced with underscores.</p>
  </div>

  <script>
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ_";

    function shiftChar(char, offset) {
      const idx = alphabet.indexOf(char);
      if (idx === -1) return char;
      return alphabet[(idx + offset + alphabet.length) % alphabet.length];
    }

    function reflectChar(char) {
      const idx = alphabet.indexOf(char);
      if (idx === -1) return char;
      return alphabet[alphabet.length - 1 - idx];
    }

    function processMessage() {
      const input = document.getElementById("message").value;
      const r1Start = parseInt(document.getElementById("rotor1").value) % 27;
      const r2Start = parseInt(document.getElementById("rotor2").value) % 27;
      const r3Start = parseInt(document.getElementById("rotor3").value) % 27;

      let rotor1 = r1Start, rotor2 = r2Start, rotor3 = r3Start;
      let encrypted = "";

      for (let ch of input) {
        const upperCh = ch.toUpperCase();
        if (!alphabet.includes(upperCh)) {
          encrypted += ch;
        } else {
          let c = shiftChar(upperCh, rotor1);
          c = shiftChar(c, rotor2);
          c = shiftChar(c, rotor3);
          c = reflectChar(c);
          c = shiftChar(c, -rotor3);
          c = shiftChar(c, -rotor2);
          c = shiftChar(c, -rotor1);
          encrypted += c;

          rotor1 = (rotor1 + 1) % 27;
          if (rotor1 === 0) {
            rotor2 = (rotor2 + 1) % 27;
            if (rotor2 === 0) rotor3 = (rotor3 + 1) % 27;
          }
        }
      }
      document.getElementById("output").value = encrypted;
    }

    const messageBox = document.getElementById("message");
    messageBox.addEventListener("keydown", e => {
      if (e.key === " ") {
        e.preventDefault();
        const start = messageBox.selectionStart;
        const end = messageBox.selectionEnd;
        messageBox.value = messageBox.value.substring(0, start) + "_" + messageBox.value.substring(end);
        messageBox.setSelectionRange(start + 1, start + 1);
      }
    });
    messageBox.addEventListener("input", () => {
      if (messageBox.value.includes(" ")) {
        const cursor = messageBox.selectionStart;
        messageBox.value = messageBox.value.replace(/ /g, "_");
        messageBox.setSelectionRange(cursor, cursor);
      }
    });

    // 🔹 URL parameter handling
    const urlParams = new URLSearchParams(window.location.search);
    const urlMessage = urlParams.get('message');
    const urlRotor1 = urlParams.get('rotor1');
    const urlRotor2 = urlParams.get('rotor2');
    const urlRotor3 = urlParams.get('rotor3');
    const urlTrigger = urlParams.get('trigger'); // true/false

    if(urlMessage !== null) document.getElementById('message').value = urlMessage;
    if(urlRotor1 !== null) document.getElementById('rotor1').value = urlRotor1;
    if(urlRotor2 !== null) document.getElementById('rotor2').value = urlRotor2;
    if(urlRotor3 !== null) document.getElementById('rotor3').value = urlRotor3;

    // 🔹 Auto-trigger encrypt/decrypt if trigger is true or missing
    const shouldTrigger = urlTrigger === null || urlTrigger.toLowerCase() === 'true';
    if(shouldTrigger) {
      processMessage();
    }
  </script>
</body>
</html>
