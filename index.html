<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secret Message Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #121212;
      color: #eee;
      padding: 30px;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #1e1e1e;
      border: 1px solid #444;
      color: white;
      border-radius: 5px;
      font-family: 'Poppins', sans-serif;
    }
    label {
      margin-top: 20px;
      display: block;
      font-weight: 600;
    }
    button {
      background-color: #00bfff;
      border: none;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
    }
    .note {
      font-size: 0.9em;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>Secret Message Generator</h1>

  <label>Message:</label>
  <textarea id="message" rows="4" placeholder="Enter your message here..."></textarea>

  <label>Enter 3-step encryption code (max 9999 for each):</label>
  <input type="number" id="rotor1" value="0" min="0" max="9999">
  <input type="number" id="rotor2" value="0" min="0" max="9999">
  <input type="number" id="rotor3" value="0" min="0" max="9999">

  <button onclick="processMessage()">Encrypt / Decrypt</button>

  <label>Output:</label>
  <textarea id="output" rows="4" readonly></textarea>

  <script>
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ_";

    function shiftChar(char, offset) {
      const idx = alphabet.indexOf(char);
      if (idx === -1) return char;
      return alphabet[(idx + offset + alphabet.length) % alphabet.length];
    }

    function reflectChar(char) {
      const idx = alphabet.indexOf(char);
      if (idx === -1) return char;
      return alphabet[alphabet.length - 1 - idx];
    }

    function processMessage() {
      const input = document.getElementById("message").value;
      const r1Start = parseInt(document.getElementById("rotor1").value) % 27;
      const r2Start = parseInt(document.getElementById("rotor2").value) % 27;
      const r3Start = parseInt(document.getElementById("rotor3").value) % 27;

      let rotor1 = r1Start, rotor2 = r2Start, rotor3 = r3Start;
      let encrypted = "";

      for (let ch of input) {
        const upperCh = ch.toUpperCase();
        if (!alphabet.includes(upperCh)) {
          encrypted += ch;
        } else {
          let c = shiftChar(upperCh, rotor1);
          c = shiftChar(c, rotor2);
          c = shiftChar(c, rotor3);

          c = reflectChar(c);

          c = shiftChar(c, -rotor3);
          c = shiftChar(c, -rotor2);
          c = shiftChar(c, -rotor1);

          encrypted += c;

          rotor1 = (rotor1 + 1) % 27;
          if (rotor1 === 0) {
            rotor2 = (rotor2 + 1) % 27;
            if (rotor2 === 0) {
              rotor3 = (rotor3 + 1) % 27;
            }
          }
        }
      }

      document.getElementById("output").value = encrypted;
    }

    const messageBox = document.getElementById("message");

    // 🔹 Replace spacebar press with underscore
    messageBox.addEventListener("keydown", function(e) {
      if (e.key === " ") {
        e.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        this.value = this.value.substring(0, start) + "_" + this.value.substring(end);
        this.setSelectionRange(start + 1, start + 1);
      }
    });

    // 🔹 Replace pasted/typed spaces with underscores
    messageBox.addEventListener("input", function() {
      if (this.value.includes(" ")) {
        const cursor = this.selectionStart;
        this.value = this.value.replace(/ /g, "_");
        this.setSelectionRange(cursor, cursor);
      }
    });
  </script>
</body>
</html>
